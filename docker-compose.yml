
services:
  backend:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      PORT: 5001
      NODE_ENV: production
    expose:
      - "5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
